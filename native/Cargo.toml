[package]
name = "dirsearch_native"
version = "0.2.20"
edition = "2021"
rust-version = "1.88"
license = "GPL-2.0-only"

[lib]
name = "dirsearch_native"
crate-type = ["cdylib"]

[dependencies]
async-compression = { version = "0.4", features = ["brotli", "gzip", "tokio", "zlib", "zstd"] }
base64 = "0.22"
brotli = "8.0"
bytes = "1.10"
cookie = "0.18"
cookie_store = { version = "=0.22.0", features = ["preserve_order"] }
digest_auth = "0.3.1"
fancy-regex = "0.19.2"
flate2 = "1.1"
futures-util = "0.3"
hmac = "0.12"
indexmap = "2.7"
md-5 = "0.10"
ntlmclient = "=0.2.0"
picky-asn1-der = "0.5"
picky-asn1-x509 = "0.15"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py313"] }
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "socks", "stream", "cookies"] }
sha2 = "0.11"
sha3 = "0.11"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
zeroize = "1.8"
zstd = "0.14"

[dev-dependencies]
http = "1.3"
md4 = "0.10"
rcgen = "=0.14.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Pin the first patched release compatible with the crate's Rust 1.88 MSRV.
time = "=0.3.47"
tokio = { version = "1.43", features = ["test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
